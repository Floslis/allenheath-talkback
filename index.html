<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talkback</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stream.css">
<link rel="stylesheet" href="talkback.css">
</head>
<body>
<!-- Oben die Gruppen (wohin Talkback geht), darunter die Mixe. Grün = hört dich, wie die Softkey-LED am Pult -->
<header class="kopfleiste"><div class="innen">
  <span class="logo" id="logo"></span><h1 id="titel">Talkback</h1>
  <div class="rechts">
    <span class="kapsel" id="status" data-t="verbinde"></span>
    <button type="button" id="pause"></button>
    <button type="button" id="beenden" data-t="beenden"></button>
    <a class="knopf" href="/einstellungen" data-t="einstellungen"></a>
  </div>
</div></header>

<main class="innen">
  <div class="kasten ecken meldung" id="weg" hidden>
    <p><b id="wegTitel"></b><br><span class="leise" id="wegText"></span></p>
    <a class="knopf" href="/einstellungen" id="wegKnopf"></a>
  </div>
  <div class="kasten meldung update" id="update" hidden>
    <p id="updateText"></p>
    <button type="button" id="updateKnopf" data-t="jetzt_installieren"></button>
  </div>

  <p class="ueber" data-t="gruppen_titel"></p>
  <p class="hinweis" data-t="gruppen_hinweis"></p>
  <div class="gruppen" id="gruppen"></div>

  <div class="zeile"><p class="ueber" id="mixTitel"></p><button type="button" class="haupt" id="fertig" data-t="fertig" hidden></button></div>
  <p class="hinweis" id="mixHinweis"></p>
  <div class="mixe" id="mixe"></div>

  <button type="button" class="aus" id="aus" data-t="niemand"></button>
  <p class="hinweis" style="margin-top:14px" data-t="erklaerung"></p>
</main>

<footer class="innen fuss">
  <span data-t="produkt_von"></span>
  <span class="ft"><svg role="img" aria-label="" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84.346 90.483"><path fill="currentColor" fill-rule="evenodd" d="M 39.949 15.004 L 39.949 1.000 L 1.000 1.000 L 1.000 9.316 L 6.617 9.316 L 6.617 43.961 L 1.000 43.961 L 1.000 52.277 L 24.707 52.277 L 24.707 43.961 L 15.586 43.961 L 15.586 32.293 L 28.062 32.293 L 28.062 24.270 L 15.586 24.270 L 15.586 9.316 L 32.219 9.316 L 32.219 15.004 Z M 51.835 89.483 L 72.112 89.483 L 72.112 81.166 L 66.499 81.166 L 66.499 46.522 L 75.616 46.522 L 75.616 52.209 L 83.346 52.209 L 83.346 38.205 L 40.237 38.205 L 40.237 52.209 L 47.971 52.209 L 47.971 46.522 L 57.378 46.522 L 57.378 81.166 L 51.835 81.166 Z"/></svg> <svg role="img" aria-label="FLOTECH" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88.628 13.031"><path fill="currentColor" fill-rule="evenodd" d="M 3.203 7.609 L 3.203 12.031 L 1.000 12.031 L 1.000 1.000 L 9.828 1.000 L 9.828 3.203 L 3.203 3.203 L 3.203 5.406 L 9.828 5.406 L 9.828 7.609 Z M 12.495 12.031 L 12.495 1.000 L 14.683 1.000 L 14.683 9.828 L 21.323 9.828 L 21.323 12.031 Z M 23.991 9.828 L 23.991 3.203 L 26.194 3.203 L 26.194 1.000 L 32.819 1.000 L 32.819 3.203 L 35.022 3.203 L 35.022 9.828 L 32.819 9.828 L 32.819 12.031 L 26.194 12.031 L 26.194 9.828 Z M 32.787 9.828 L 32.787 3.203 L 26.225 3.203 L 26.225 9.828 Z M 44.319 3.203 L 44.319 12.031 L 42.116 12.031 L 42.116 3.203 L 37.694 3.203 L 37.694 1.000 L 48.725 1.000 L 48.725 3.203 Z M 51.398 12.031 L 51.398 1.000 L 60.226 1.000 L 60.226 3.203 L 53.601 3.203 L 53.601 5.406 L 60.226 5.406 L 60.226 7.609 L 53.601 7.609 L 53.601 9.828 L 60.226 9.828 L 60.226 12.031 Z M 65.096 3.203 L 65.096 9.828 L 71.721 9.828 L 71.721 12.031 L 65.096 12.031 L 65.096 9.828 L 62.893 9.828 L 62.893 3.203 Z M 71.721 5.422 L 71.721 3.203 L 65.096 3.203 L 65.096 1.000 L 71.721 1.000 L 71.721 3.203 L 73.924 3.203 L 73.924 5.422 Z M 71.721 9.828 L 71.721 7.609 L 73.924 7.609 L 73.924 9.828 Z M 85.424 12.031 L 85.424 7.609 L 78.799 7.609 L 78.799 12.031 L 76.596 12.031 L 76.596 1.000 L 78.799 1.000 L 78.799 5.406 L 85.424 5.406 L 85.424 1.000 L 87.628 1.000 L 87.628 12.031 Z"/></svg></span>
  <a class="kofi" href="https://ko-fi.com/floslist" target="_blank" rel="noopener">☕ <span data-t="kofi"></span></a>
  <span class="version" id="version"></span>
</footer>

<script src="oberflaeche.js"></script>
<script>
// Zustand kommt vom Talkback-Server (talkback.py), der mit dem Pult spricht. Gruppen und Mixe stehen in einstellungen.json.
let Z = null, bearbeite = null, bauplan = '';
const $ = (id) => document.getElementById(id);
const ZAHNRAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
const alle = () => Z.ziele.map((_, i) => i);
const gruppe = (name) => Z.gruppen.find((g) => g.name === name);
const titel = (i) => Z.namen[i] || Z.ziele[i];
const namen = (l) => l.length ? l.map(titel).join(', ') : t('noch_niemand');
const hoeren = () => alle().filter((i) => Z.an[i]);
const post = (pfad, daten = {}) => fetch(pfad, { method: 'POST', body: JSON.stringify(daten) }).catch(() => {});

async function setzen(liste) {
  const an = alle().map((i) => liste.includes(i));
  Z.an = an; malen();
  await post('/setzen', { an });
}
async function umschalten(name) {
  Z.gruppen_an[name] = !Z.gruppen_an[name]; malen();
  await post('/gruppe', { name });
}

function aufbauen() {
  $('gruppen').replaceChildren();
  $('mixe').replaceChildren();
  if (!Z.gruppen.length) { const p = document.createElement('p'); p.className = 'leise'; p.textContent = t('keine_gruppen'); $('gruppen').append(p); }
  for (const g of Z.gruppen) {
    const name = g.name;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'gruppe'; b.dataset.name = name;
    b.innerHTML = '<span class="name"></span><small></small><span class="led" aria-hidden="true"></span>';
    b.querySelector('.name').textContent = name;
    b.onclick = () => { if (bearbeite) { if (!gruppe(name).rest) { bearbeite = name; malen(); } } else umschalten(name); };
    if (!g.rest) {
      // Zahnrad: festlegen, wer zu dieser Gruppe gehört
      const z = document.createElement('span');
      z.className = 'zahnrad'; z.setAttribute('role', 'button'); z.tabIndex = 0;
      z.title = t('bearbeiten', { name }); z.setAttribute('aria-label', z.title);
      z.innerHTML = ZAHNRAD;
      const los = (e) => { e.stopPropagation(); bearbeite = bearbeite === name ? null : name; malen(); };
      z.addEventListener('click', los);
      z.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); los(e); } });
      b.append(z);
    }
    $('gruppen').append(b);
  }
  Z.ziele.forEach((ziel, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'mix'; b.id = `mix-${i}`;
    b.innerHTML = '<span class="nr"></span><span class="name"></span><span class="led" aria-hidden="true"></span>';
    b.querySelector('.nr').textContent = ziel;
    b.onclick = () => {
      if (bearbeite) {
        const g = gruppe(bearbeite), k = g.indizes.indexOf(i);
        k < 0 ? g.indizes.push(i) : g.indizes.splice(k, 1); g.indizes.sort((a, c) => a - c);
        post('/gruppe-mixe', { name: g.name, indizes: g.indizes }); malen();
      } else {
        const h = hoeren(), k = h.indexOf(i);   // einzelnen Mix dazu- oder wegschalten
        k < 0 ? h.push(i) : h.splice(k, 1); setzen(h);
      }
    };
    $('mixe').append(b);
  });
}

function malen() {
  const online = Z.verbunden && !Z.pausiert, h = hoeren();
  const st = $('status');
  st.className = 'kapsel ' + (Z.pausiert ? 'warn' : Z.verbunden ? 'gut' : 'schlecht');
  st.textContent = Z.pausiert ? t('pausiert') : Z.verbunden ? t('verbunden') : t('nicht_erreichbar', { ip: Z.pult_ip });
  $('pause').textContent = Z.pausiert ? t('fortsetzen') : t('pause');
  $('pause').className = Z.pausiert ? 'haupt' : '';
  // Kasten mit roten Eckwinkeln: nur wenn wirklich etwas nicht geht
  $('weg').hidden = Z.verbunden || Z.pausiert;
  $('wegTitel').textContent = t('nicht_erreichbar', { ip: Z.pult_ip });
  $('wegText').textContent = t('nicht_erreichbar_text');
  $('wegKnopf').textContent = t('pult_suchen');
  $('update').hidden = !Z.update || !!bearbeite;
  if (Z.update && !$('updateKnopf').disabled) $('updateText').textContent = t('update_da', { v: Z.update.version }) + ' ' + (Z.auto_update ? t('update_nachts') : t('update_aus'));
  for (const b of $('gruppen').querySelectorAll('.gruppe')) {
    const g = gruppe(b.dataset.name);
    const softkey = g.mutegruppe ? ' · ' + t('softkey_mg', { n: g.mutegruppe }) : '';
    b.querySelector('small').textContent = (g.rest ? t('alle_uebrigen') : namen(g.indizes)) + softkey;
    b.setAttribute('aria-pressed', String(!bearbeite && online && !!Z.gruppen_an[g.name]));
    b.classList.toggle('bearbeitet', bearbeite === g.name);
    b.disabled = bearbeite ? g.rest : !online || g.indizes.length === 0;
  }
  const drin = bearbeite ? gruppe(bearbeite).indizes : [];
  Z.ziele.forEach((_, i) => {
    const b = $(`mix-${i}`);
    b.querySelector('.name').textContent = Z.namen[i] || '–';
    b.classList.toggle('unbekannt', !bearbeite && online && Z.an[i] === null);
    b.classList.toggle('drin', !!bearbeite && drin.includes(i));
    b.disabled = !bearbeite && !online;
    b.setAttribute('aria-pressed', String(bearbeite ? drin.includes(i) : online && Z.an[i] === true));
  });
  $('mixTitel').textContent = bearbeite ? t('mixe_bearbeiten', { name: bearbeite }) : t('mixe_titel');
  $('mixHinweis').textContent = bearbeite ? t('mixe_bearbeiten_hinweis') : t('mixe_hinweis');
  $('aus').hidden = !!bearbeite;
  $('aus').disabled = !online || h.length === 0;
  $('fertig').hidden = !bearbeite;
  $('version').textContent = 'v' + Z.version;
}

$('fertig').onclick = () => { bearbeite = null; malen(); };
$('aus').onclick = () => setzen([]);
$('pause').onclick = async () => { Z.pausiert = !Z.pausiert; malen(); await post('/pause', { an: Z.pausiert }); };
$('beenden').onclick = async () => {
  if (!confirm(t('beenden_frage'))) return;
  await post('/beenden');
  document.body.innerHTML = `<main class="innen"><p class="ueber">${t('beendet_titel')}</p><p>${t('beendet_text')}</p></main>`;
};
$('updateKnopf').onclick = async () => {
  $('updateKnopf').disabled = true; $('updateText').textContent = t('installiere');
  await post('/update');
};

async function holen() {
  try {
    const neu = await (await fetch('/zustand')).json();
    if (bearbeite && Z) neu.gruppen = Z.gruppen; // beim Bearbeiten nicht überschreiben
    Z = neu;
    // neu aufbauen, wenn sich Gruppen oder Mixe in den Einstellungen geändert haben
    const plan = JSON.stringify([Z.ziele, Z.gruppen.map((g) => [g.name, g.rest])]);
    if (plan !== bauplan) { bauplan = plan; if (bearbeite && !gruppe(bearbeite)) bearbeite = null; aufbauen(); }
    malen();
  } catch {
    if (Z) { $('status').className = 'kapsel schlecht'; $('status').textContent = t('programm_aus'); }
  }
  setTimeout(holen, 500);
}
OBERFLAECHE.then(holen);
</script>
</body>
</html>
