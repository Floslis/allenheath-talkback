<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avantis Talkback</title>
<style>
/* Layout: ein Bildschirm fürs Tablet am Pult – oben die Gruppen (wohin Talkback geht), darunter die 12 In-Ear-Mixe, die zeigen, wer dich hört */
:root {
  --bg: #eef0f2; --flaeche: #ffffff; --linie: #c9ced6; --text: #14181f; --leise: #5b6472;
  --an: #d9282f; --an-hell: #fde7e8; --wahl: #1f6feb; --wahl-hell: #dbe8ff;
  --display: "Barlow Condensed", "Avenir Next Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Avenir Next", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1014; --flaeche: #171b21; --linie: #2a313b; --text: #e8ebf0; --leise: #8c96a5;
  --an: #ff4d52; --an-hell: #3a1517; --wahl: #4c8dff; --wahl-hell: #16243d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1014; --flaeche: #171b21; --linie: #2a313b; --text: #e8ebf0; --leise: #8c96a5;
  --an: #ff4d52; --an-hell: #3a1517; --wahl: #4c8dff; --wahl-hell: #16243d; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; }
.app { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 24px; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: .02em; margin: 0; }
.status { font-family: var(--mono); font-size: 12px; color: var(--leise); border: 1px solid var(--linie); border-radius: 999px; padding: 3px 10px; }
.status b { color: var(--an); font-weight: 600; }
.kopf { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 8px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--leise); margin: 0; font-weight: 600; }
.gruppen { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.gruppe { font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: .03em; padding: 14px 12px 10px; border-radius: 10px;
  border: 2px solid var(--linie); background: var(--flaeche); color: var(--text); cursor: pointer; display: grid; gap: 2px; text-align: left; }
.gruppe small { font-family: var(--body); font-size: 13px; font-weight: 500; color: var(--leise); letter-spacing: 0; }
.gruppe[aria-pressed="true"] { border-color: var(--an); background: var(--an-hell); color: var(--an); }
.gruppe.bearbeitet { border-color: var(--wahl); background: var(--wahl-hell); color: var(--text); }
.mixe { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .mixe { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.mix { border: 2px solid var(--linie); background: var(--flaeche); color: var(--text); border-radius: 10px; padding: 10px 8px; cursor: pointer;
  display: grid; gap: 4px; text-align: left; min-height: 74px; align-content: start; }
.mix .nr { font-family: var(--mono); font-size: 11px; color: var(--leise); }
.mix .name { font-weight: 600; font-size: 15px; line-height: 1.2; overflow-wrap: anywhere; }
.mix.hoert { border-color: var(--an); background: var(--an-hell); }
.mix.hoert .nr { color: var(--an); font-weight: 600; }
.mix.drin { border-color: var(--wahl); background: var(--wahl-hell); }
.mix:disabled, .gruppe:disabled, .aus:disabled { cursor: default; opacity: .45; }
.mix.unbekannt { border-style: dashed; }
.status.ok b { color: #2da44e; }
.kopfrechts { display: flex; gap: 8px; align-items: center; }
a.knopf { text-decoration: none; }
.leer { color: var(--leise); font-size: 14px; }
.knopf { border: 1px solid var(--linie); background: var(--flaeche); color: var(--text); border-radius: 8px; padding: 7px 12px; font: 600 14px var(--body); cursor: pointer; }
.knopf[aria-pressed="true"] { border-color: var(--wahl); color: var(--wahl); }
.aus { border: 2px solid var(--linie); background: var(--flaeche); color: var(--text); border-radius: 10px; padding: 12px; font: 600 15px var(--body); cursor: pointer; }
.marke { display: flex; align-items: center; gap: 14px; }
.logo:empty { display: none; }
.logo svg { height: 34px; width: auto; color: var(--text); display: block; }
footer { display: flex; align-items: center; gap: 8px; color: var(--leise); font-size: 12px; padding-top: 8px; border-top: 1px solid var(--linie); }
.logo-ft { height: 20px; width: auto; }
.logo-ftname { height: 11px; width: auto; }
.gruppe { position: relative; }
.zahnrad { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center;
  color: var(--leise); border: 1px solid var(--linie); background: var(--bg); }
.zahnrad svg { width: 18px; height: 18px; }
.zahnrad:hover, .gruppe.bearbeitet .zahnrad { color: var(--wahl); border-color: var(--wahl); }
.hinweis { font-size: 13px; color: var(--leise); line-height: 1.5; margin: 0; max-width: 72ch; }
button:focus-visible { outline: 3px solid var(--wahl); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { .gruppe, .mix { transition: background .12s, border-color .12s, color .12s; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700&family=JetBrains+Mono:wght@400;600&display=swap">

<div class="app">
  <header>
    <div class="marke"><span class="logo" id="logo"></span> <h1 id="titel">Talkback</h1></div>
    <span class="kopfrechts"><span class="status" id="status"><b>verbinde …</b></span> <a class="knopf" href="/einstellungen">Einstellungen</a></span>
  </header>

  <section>
    <div class="kopf"><p class="label">Talkback geht an · antippen oder Softkey am Pult schaltet die Gruppe an/aus, mehrere gleichzeitig möglich</p></div>
    <div class="gruppen" id="gruppen"></div>
  </section>

  <section>
    <div class="kopf">
      <p class="label" id="mixLabel">In-Ear-Mixe</p>
      <button class="knopf" id="fertig" type="button" hidden>Fertig</button>
    </div>
    <div class="mixe" id="mixe"></div>
  </section>

  <button class="aus" id="aus" type="button">Talkback an niemanden</button>

  <p class="hinweis" id="hinweis"></p>

  <footer><span>Ein Produkt von</span><svg class="logo-ft" role="img" aria-label="" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84.346 90.483"><path fill="currentColor" fill-rule="evenodd" d="M 39.949 15.004 L 39.949 1.000 L 1.000 1.000 L 1.000 9.316 L 6.617 9.316 L 6.617 43.961 L 1.000 43.961 L 1.000 52.277 L 24.707 52.277 L 24.707 43.961 L 15.586 43.961 L 15.586 32.293 L 28.062 32.293 L 28.062 24.270 L 15.586 24.270 L 15.586 9.316 L 32.219 9.316 L 32.219 15.004 Z M 51.835 89.483 L 72.112 89.483 L 72.112 81.166 L 66.499 81.166 L 66.499 46.522 L 75.616 46.522 L 75.616 52.209 L 83.346 52.209 L 83.346 38.205 L 40.237 38.205 L 40.237 52.209 L 47.971 52.209 L 47.971 46.522 L 57.378 46.522 L 57.378 81.166 L 51.835 81.166 Z"/></svg> <svg class="logo-ftname" role="img" aria-label="FLOTECH" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88.628 13.031"><path fill="currentColor" fill-rule="evenodd" d="M 3.203 7.609 L 3.203 12.031 L 1.000 12.031 L 1.000 1.000 L 9.828 1.000 L 9.828 3.203 L 3.203 3.203 L 3.203 5.406 L 9.828 5.406 L 9.828 7.609 Z M 12.495 12.031 L 12.495 1.000 L 14.683 1.000 L 14.683 9.828 L 21.323 9.828 L 21.323 12.031 Z M 23.991 9.828 L 23.991 3.203 L 26.194 3.203 L 26.194 1.000 L 32.819 1.000 L 32.819 3.203 L 35.022 3.203 L 35.022 9.828 L 32.819 9.828 L 32.819 12.031 L 26.194 12.031 L 26.194 9.828 Z M 32.787 9.828 L 32.787 3.203 L 26.225 3.203 L 26.225 9.828 Z M 44.319 3.203 L 44.319 12.031 L 42.116 12.031 L 42.116 3.203 L 37.694 3.203 L 37.694 1.000 L 48.725 1.000 L 48.725 3.203 Z M 51.398 12.031 L 51.398 1.000 L 60.226 1.000 L 60.226 3.203 L 53.601 3.203 L 53.601 5.406 L 60.226 5.406 L 60.226 7.609 L 53.601 7.609 L 53.601 9.828 L 60.226 9.828 L 60.226 12.031 Z M 65.096 3.203 L 65.096 9.828 L 71.721 9.828 L 71.721 12.031 L 65.096 12.031 L 65.096 9.828 L 62.893 9.828 L 62.893 3.203 Z M 71.721 5.422 L 71.721 3.203 L 65.096 3.203 L 65.096 1.000 L 71.721 1.000 L 71.721 3.203 L 73.924 3.203 L 73.924 5.422 Z M 71.721 9.828 L 71.721 7.609 L 73.924 7.609 L 73.924 9.828 Z M 85.424 12.031 L 85.424 7.609 L 78.799 7.609 L 78.799 12.031 L 76.596 12.031 L 76.596 1.000 L 78.799 1.000 L 78.799 5.406 L 85.424 5.406 L 85.424 1.000 L 87.628 1.000 L 87.628 12.031 Z"/></svg> </footer>
</div>

<script>
// Branding-Profil (branding/<name>/profil.json): Titel, Logo, Farben
(async () => {
  try {
    const b = await (await fetch('/branding.json')).json();
    document.title = b.titel + (document.title.includes('·') ? ' · ' + document.title.split('·').pop().trim() : '');
    const t = document.getElementById('titel'); if (t) t.textContent = b.titel;
    const l = document.getElementById('logo'); if (l) l.innerHTML = b.logo || '';
    const css = (v) => Object.entries(v || {}).map(([k, w]) => `--${k}: ${w};`).join(' ');
    const f = b.farben || {};
    const s = document.createElement('style');
    s.textContent = `:root { ${css(f.hell)} }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { ${css(f.dunkel)} } }
:root[data-theme="dark"] { ${css(f.dunkel)} }`;
    document.head.append(s);
  } catch {}
})();

// Zustand kommt vom Talkback-Server (talkback.py), der mit dem Pult spricht. Gruppen und Mixe stehen in einstellungen.json.
let Z = null, bearbeite = null, bauplan = '';
const $ = (id) => document.getElementById(id);
const ZAHNRAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
const alle = () => Z.ziele.map((_, i) => i);
const gruppe = (name) => Z.gruppen.find((g) => g.name === name);
const titel = (i) => Z.namen[i] || Z.ziele[i];
const namen = (l) => l.length ? l.map(titel).join(', ') : 'noch niemand';
const hoeren = () => alle().filter((i) => Z.an[i]);

async function setzen(liste) {
  const an = alle().map((i) => liste.includes(i));
  Z.an = an; malen();
  try { await fetch('/setzen', { method: 'POST', body: JSON.stringify({ an }) }); } catch {}
}
async function umschalten(name) {
  Z.gruppen_an[name] = !Z.gruppen_an[name]; malen();
  try { await fetch('/gruppe', { method: 'POST', body: JSON.stringify({ name }) }); } catch {}
}
async function mixeSpeichern(g) {
  try { await fetch('/gruppe-mixe', { method: 'POST', body: JSON.stringify({ name: g.name, indizes: g.indizes }) }); } catch {}
}

function aufbauen() {
  $('gruppen').replaceChildren();
  $('mixe').replaceChildren();
  if (!Z.gruppen.length) $('gruppen').innerHTML = '<p class="leer">Noch keine Gruppen. Unter „Einstellungen“ anlegen.</p>';
  for (const g of Z.gruppen) {
    const name = g.name;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'gruppe'; b.dataset.name = name;
    b.innerHTML = `<span></span><small></small>`; b.firstChild.textContent = name;
    b.onclick = () => { if (bearbeite) { if (!gruppe(name).rest) { bearbeite = name; malen(); } } else umschalten(name); };
    if (!g.rest) {
      // Zahnrad: festlegen, wer zu dieser Gruppe gehört
      const z = document.createElement('span');
      z.className = 'zahnrad'; z.setAttribute('role', 'button'); z.tabIndex = 0; z.title = `${name} bearbeiten`; z.setAttribute('aria-label', `${name} bearbeiten`);
      z.innerHTML = ZAHNRAD;
      const los = (e) => { e.stopPropagation(); bearbeite = bearbeite === name ? null : name; malen(); };
      z.addEventListener('click', los);
      z.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); los(e); } });
      b.append(z);
    }
    $('gruppen').append(b);
  }
  Z.ziele.forEach((ziel, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'mix'; b.id = `mix-${i}`;
    b.innerHTML = `<span class="nr"></span><span class="name"></span>`;
    b.querySelector('.nr').textContent = ziel;
    b.onclick = () => {
      if (bearbeite) {
        const g = gruppe(bearbeite), k = g.indizes.indexOf(i);
        k < 0 ? g.indizes.push(i) : g.indizes.splice(k, 1); g.indizes.sort((a, c) => a - c);
        mixeSpeichern(g); malen();
      } else {
        // einzelnen Mix dazu- oder wegschalten
        const h = hoeren(), k = h.indexOf(i);
        k < 0 ? h.push(i) : h.splice(k, 1); setzen(h);
      }
    };
    $('mixe').append(b);
  });
  $('fertig').onclick = () => { bearbeite = null; malen(); };
  $('aus').onclick = () => setzen([]);
}

function malen() {
  const online = Z.verbunden, h = hoeren();
  $('status').className = 'status' + (online ? ' ok' : '');
  $('status').innerHTML = online ? 'Pult · <b>verbunden</b>' : '<b>Pult nicht verbunden</b> · versuche neu …';
  for (const b of $('gruppen').querySelectorAll('.gruppe')) {
    const g = gruppe(b.dataset.name);
    const softkey = g.mutegruppe ? ` · Softkey MG ${g.mutegruppe}` : '';
    b.querySelector('small').textContent = (g.rest ? 'alle übrigen' : namen(g.indizes)) + softkey;
    b.setAttribute('aria-pressed', String(!bearbeite && online && !!Z.gruppen_an[g.name]));
    b.classList.toggle('bearbeitet', bearbeite === g.name);
    b.disabled = bearbeite ? g.rest : !online || g.indizes.length === 0;
  }
  const drin = bearbeite ? gruppe(bearbeite).indizes : [];
  Z.ziele.forEach((_, i) => {
    const b = $(`mix-${i}`);
    b.querySelector('.name').textContent = Z.namen[i] || '–';
    b.classList.toggle('hoert', !bearbeite && Z.an[i] === true);
    b.classList.toggle('unbekannt', !bearbeite && Z.an[i] === null);
    b.classList.toggle('drin', !!bearbeite && drin.includes(i));
    b.disabled = !bearbeite && !online;
    b.setAttribute('aria-pressed', String(bearbeite ? drin.includes(i) : Z.an[i] === true));
  });
  $('aus').hidden = !!bearbeite;
  $('aus').disabled = !online || h.length === 0;
  $('fertig').hidden = !bearbeite;
  $('mixLabel').textContent = bearbeite ? `Wer gehört zu ${bearbeite}? Antippen zum Hinzufügen oder Entfernen` : 'In-Ear-Mixe · rot = hört dich, wenn du die Taste am Mikro drückst · antippen schaltet einzeln';
  $('hinweis').textContent = bearbeite
    ? 'Mit dem Zahnrad an einer Gruppe wechselst du, welche du bearbeitest. Eine Gruppe „alle übrigen“ passt sich von selbst an.'
    : 'Die Taste am Mikro schaltet das Sprechen. Diese Seite legt nur fest, wer es hört: Sie schaltet am Pult das Assign vom Talkback-Kanal auf die gewählten Mixe. Änderungen am Pult erscheinen hier von selbst.';
}

async function holen() {
  try {
    const neu = await (await fetch('/zustand')).json();
    if (bearbeite && Z) neu.gruppen = Z.gruppen; // beim Bearbeiten nicht überschreiben
    Z = neu;
    // neu aufbauen, wenn sich Gruppen oder Mixe in den Einstellungen geändert haben
    const plan = JSON.stringify([Z.ziele, Z.gruppen.map((g) => [g.name, g.rest])]);
    if (plan !== bauplan) { bauplan = plan; if (bearbeite && !gruppe(bearbeite)) bearbeite = null; aufbauen(); }
    malen();
  } catch {
    if (Z) { Z.verbunden = false; malen(); $('status').innerHTML = '<b>Talkback-Programm läuft nicht</b>'; }
  }
  setTimeout(holen, 500);
}
holen();
</script>
