<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talkback · Einstellungen</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stream.css">
<link rel="stylesheet" href="talkback.css">
</head>
<body data-seite="einstellungen">
<!-- Einstellungen: Aussehen, Updates, Pult, welche Mixe im Tool erscheinen, Gruppen mit Softkey (Mute-Gruppe) -->
<header class="kopfleiste"><div class="innen">
  <span class="logo" id="logo"></span><h1 data-t="einstellungen"></h1>
  <div class="rechts"><a class="knopf zurueck" href="/" data-t="zurueck"></a></div>
</div></header>

<main class="innen">
  <p class="ueber" data-t="aussehen"></p>
  <div class="kasten felder">
    <label class="feld"><span data-t="branding"></span><small data-t="branding_klein"></small><select id="branding"></select></label>
    <label class="feld"><span data-t="sprache"></span><small data-t="sprache_klein"></small>
      <select id="sprache"><option value="auto" data-t="sprache_auto"></option><option value="de">Deutsch</option><option value="en">English</option></select></label>
  </div>

  <p class="ueber" data-t="updates"></p>
  <div class="kasten">
    <label class="chip"><input type="checkbox" id="auto_update"> <span data-t="auto_update"></span></label>
    <p class="hinweis" style="margin:10px 0" data-t="updates_hinweis"></p>
    <div class="zeile" style="justify-content:flex-start;align-items:center">
      <span id="version" class="leise"></span>
      <button type="button" id="updatePruefen" data-t="nach_updates"></button>
      <span id="updateErgebnis"></span>
    </div>
  </div>

  <p class="ueber" data-t="pult"></p>
  <div class="kasten">
    <div class="felder">
      <label class="feld"><span data-t="pult_typ"></span><small data-t="pult_typ_klein"></small><select id="pult_typ"></select></label>
      <div class="feld"><label class="feld"><span data-t="ip"></span><small data-t="ip_klein"></small><input type="text" id="pult_ip" inputmode="decimal"></label>
        <button type="button" id="suchen" data-t="pult_suchen"></button></div>
      <label class="feld"><span data-t="tb_kanal"></span><small data-t="tb_kanal_klein"></small><input type="number" id="talkback_kanal" min="1" max="128"></label>
      <label class="feld"><span data-t="midi_kanal"></span><small data-t="midi_kanal_klein"></small><input type="number" id="midi_kanal" min="1" max="12"></label>
    </div>
    <p class="hinweis" id="sucheText" style="margin:12px 0 8px" hidden></p>
    <div class="chips" id="treffer"></div>
  </div>

  <p class="ueber" data-t="mixe_im_tool"></p>
  <div class="kasten">
    <div class="chips" id="ziele"></div>
    <p class="hinweis" style="margin:10px 0 0" data-t="namen_vom_pult"></p>
  </div>

  <p class="ueber" data-t="gruppen"></p>
  <div id="gruppen"></div>
  <button type="button" id="neu" data-t="gruppe_neu"></button>
  <p class="hinweis" style="margin-top:12px" data-t="gruppen_erklaerung"></p>

  <div class="speicherleiste">
    <button type="button" class="haupt" id="speichern" data-t="speichern"></button>
    <span class="ergebnis" id="ergebnis"></span>
  </div>
</main>

<script src="oberflaeche.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let ALLE = [], BESCHRIFTUNG = {};  // mögliche Mixe kommen vom Treiber des gewählten Pults
const titel = (k) => BESCHRIFTUNG[k] || k;
const FELDER = ['pult_ip', 'talkback_kanal', 'midi_kanal'];
let cfg, namen = {}, vorhanden = null;  // vorhanden: Mixe, die das Pult wirklich hat (null = noch unbekannt)

function chip(text, klein, an, onchange) {
  const l = document.createElement('label');
  l.className = 'chip';
  const i = document.createElement('input');
  i.type = 'checkbox'; i.checked = an;
  i.onchange = () => onchange(i.checked);
  l.append(i, document.createTextNode(text));
  if (klein) { const s = document.createElement('small'); s.textContent = klein; l.append(s); }
  return l;
}
function feld(label, eingabe) {
  const l = document.createElement('label');
  l.className = 'feld';
  const s = document.createElement('span'); s.textContent = label;
  l.append(s, eingabe);
  return l;
}

function malen() {
  $('branding').replaceChildren(...Object.entries(cfg.profile).map(([k, n]) => new Option(n, k)));
  $('branding').value = cfg.branding;
  $('pult_typ').replaceChildren(...Object.entries(cfg.pult_typen).map(([k, n]) => new Option(n, k)));
  $('pult_typ').value = cfg.pult_typ;
  $('sprache').value = cfg.sprache;
  $('auto_update').checked = cfg.auto_update;
  for (const f of FELDER) $(f).value = cfg[f];
  const zeigen = ALLE.filter((k) => !vorhanden || k in vorhanden || cfg.ziele.includes(k));
  $('ziele').replaceChildren(...zeigen.map((k) => chip(titel(k), namen[k], cfg.ziele.includes(k), (an) => {
    cfg.ziele = an ? ALLE.filter((x) => x === k || cfg.ziele.includes(x)) : cfg.ziele.filter((x) => x !== k);
    for (const g of cfg.gruppen) g.mixe = g.mixe.filter((m) => cfg.ziele.includes(m));
    malen();
  })));
  $('gruppen').replaceChildren(...cfg.gruppen.map((g, gi) => {
    const box = document.createElement('div');
    box.className = 'kasten gruppe-kasten';
    const kopf = document.createElement('div');
    kopf.className = 'gruppe-kopf';
    const ni = document.createElement('input');
    ni.type = 'text'; ni.maxLength = 20; ni.value = g.name; ni.oninput = () => { g.name = ni.value; };
    const ms = document.createElement('select');
    ms.append(new Option(t('keiner'), ''), ...[...Array(24)].map((_, i) => new Option(t('mute_gruppe', { n: i + 1 }), i + 1)));
    ms.value = g.mutegruppe ?? ''; ms.onchange = () => { g.mutegruppe = ms.value ? +ms.value : null; };
    const rest = document.createElement('label');
    rest.className = 'rest';
    const ri = document.createElement('input');
    ri.type = 'checkbox'; ri.checked = g.rest;
    ri.onchange = () => { cfg.gruppen.forEach((h) => { h.rest = h === g && ri.checked; }); malen(); };
    rest.append(ri, document.createTextNode(t('alle_uebrigen')));
    const weg = document.createElement('button');
    weg.type = 'button'; weg.className = 'weg'; weg.textContent = t('entfernen');
    weg.onclick = () => { cfg.gruppen.splice(gi, 1); malen(); };
    kopf.append(feld(t('name'), ni), feld(t('softkey'), ms), rest, weg);
    box.append(kopf);
    if (!g.rest) {
      const mixe = document.createElement('div');
      mixe.className = 'chips';
      mixe.append(...cfg.ziele.map((k) => chip(titel(k), namen[k], g.mixe.includes(k), (an) => {
        g.mixe = an ? cfg.ziele.filter((x) => x === k || g.mixe.includes(x)) : g.mixe.filter((x) => x !== k);
      })));
      box.append(mixe);
    }
    return box;
  }));
}

$('branding').onchange = () => { cfg.branding = $('branding').value; };
$('pult_typ').onchange = () => { cfg.pult_typ = $('pult_typ').value; };
$('sprache').onchange = () => { cfg.sprache = $('sprache').value; };
$('auto_update').onchange = () => { cfg.auto_update = $('auto_update').checked; };
$('neu').onclick = () => { cfg.gruppen.push({ name: t('gruppe_n', { n: cfg.gruppen.length + 1 }), rest: false, mixe: [], mutegruppe: null }); malen(); };

$('suchen').onclick = async () => {
  $('suchen').disabled = true; $('suchen').textContent = t('suche_laeuft');
  $('sucheText').hidden = false; $('sucheText').textContent = t('suche_lauscht');
  $('treffer').replaceChildren();
  try {
    const liste = await (await fetch('/suche')).json();
    if (!Array.isArray(liste) || !liste.length) {
      $('sucheText').textContent = t('suche_nichts');
    } else {
      $('sucheText').textContent = t('suche_gefunden');
      $('treffer').replaceChildren(...liste.map((p) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = `${p.ip} · ${p.modell}${p.firmware ? ' · ' + t('firmware') + ' ' + p.firmware : ''}`;
        b.onclick = () => { $('pult_ip').value = p.ip; cfg.pult_ip = p.ip; $('sucheText').textContent = t('suche_uebernommen', { ip: p.ip }); };
        return b;
      }));
    }
  } catch { $('sucheText').textContent = t('suche_fehler'); }
  $('suchen').disabled = false; $('suchen').textContent = t('pult_suchen');
};

$('updatePruefen').onclick = async () => {
  $('updatePruefen').disabled = true; $('updateErgebnis').textContent = t('suche_laeuft');
  try {
    const r = await fetch('/update-pruefen', { method: 'POST', body: '{}' });
    const neu = await r.json();
    if (!r.ok) throw new Error();
    if (neu) {
      $('updateErgebnis').textContent = t('update_da', { v: neu.version }) + ' ';
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'haupt'; b.textContent = t('jetzt_installieren');
      b.onclick = async () => { b.disabled = true; $('updateErgebnis').textContent = t('installiere'); await fetch('/update', { method: 'POST', body: '{}' }); };
      $('updateErgebnis').append(b);
    } else $('updateErgebnis').textContent = t('aktuell');
  } catch { $('updateErgebnis').textContent = t('update_fehler'); }
  $('updatePruefen').disabled = false;
};

$('speichern').onclick = async () => {
  for (const f of FELDER) cfg[f] = f === 'pult_ip' ? $(f).value.trim() : +$(f).value;
  const r = await fetch('/einstellungen', { method: 'POST', body: JSON.stringify(cfg) });
  $('ergebnis').className = 'ergebnis' + (r.ok ? '' : ' fehler');
  $('ergebnis').textContent = r.ok ? t('gespeichert') : t('nicht_gespeichert', { grund: await r.json() });
  if (r.ok) setTimeout(() => location.reload(), 600); // neues Branding und neue Sprache sofort sehen
};

OBERFLAECHE.then(async () => {
  cfg = await (await fetch('/einstellungen.json')).json();
  ALLE = cfg.moegliche_ziele.map(([k]) => k);
  BESCHRIFTUNG = Object.fromEntries(cfg.moegliche_ziele);
  try {
    const z = await (await fetch('/zustand')).json();
    z.keys.forEach((k, i) => { if (z.namen[i]) namen[k] = z.namen[i]; });
    if (Object.keys(z.vorhanden || {}).length) { vorhanden = z.vorhanden; Object.assign(namen, z.vorhanden); }
    $('version').textContent = t('version_ist', { v: z.version });
  } catch {}
  malen();
});
</script>
</body>
</html>
